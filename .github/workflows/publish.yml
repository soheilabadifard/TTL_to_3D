name: publish

# Runs when a GitHub release is published by hand, by hand for an existing tag, or called by
# release.yml after it tagged a merge (a release the workflow token creates fires no `release`
# event, so the caller runs this directly). Publishes to PyPI through trusted publishing (the
# "pypi" environment; no token stored) and attaches the built files to the release.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "existing tag to publish, e.g. v0.2.2"
        required: true
  workflow_call:
    inputs:
      tag:
        description: "the tag release.yml just created"
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - name: the wheel installs, carries the tagged version and renders the demo
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          pip install dist/*.whl
          cd /tmp                                   # away from the checkout: the installed package answers
          test "$(ttl3d --version)" = "ttl3d ${TAG#v}"
          ttl3d "$GITHUB_WORKSPACE/examples/solar-system.ttl" -o /tmp/solar.html && test -s /tmp/solar.html
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@v1.14.2

  release-assets:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag || github.event.release.tag_name }}" dist/* --clobber --repo "${{ github.repository }}"
