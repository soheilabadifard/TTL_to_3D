name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e .[test] ruff
      - run: ruff check ttl3d tests tools
      - run: python -m pytest -q
      - name: the loader on the oldest rdflib the pin allows (7.0.0 has no Dataset.graphs)
        if: matrix.python-version == '3.10' && matrix.os == 'ubuntu-latest'
        run: |
          pip install "rdflib==7.0.0"
          python -m pytest -q tests/test_load.py tests/test_graph.py

  browser:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, browser: chromium}
          - {os: ubuntu-latest, browser: firefox}
          - {os: ubuntu-latest, browser: webkit}
          - {os: windows-latest, browser: chromium}
          - {os: macos-latest, browser: chromium}
    env:
      TTL3D_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e .[browser]
      - run: playwright install --with-deps ${{ matrix.browser }}
      - name: the browser tests must run here, not skip
        run: python -c "import playwright.sync_api"
      - run: python -m pytest -q tests/test_viewer.py

  pages:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install .
      - name: render the demo in every mode
        run: |
          ttl3d examples/solar-system.ttl examples/solar-system-missions.ttl -o pages/solar-3d.html
          ttl3d examples/solar-system.ttl examples/solar-system-missions.ttl --view 2d -o pages/solar-2d.html
          ttl3d examples/solar-system.ttl examples/solar-system-missions.ttl --layout force --color-by type -o pages/solar-force.html
          ttl3d examples/solar-system.trig -o pages/solar-trig.html
      - uses: actions/upload-artifact@v7
        with:
          name: pages-${{ matrix.os }}
          path: pages

  identical-pages:
    needs: pages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          pattern: pages-*
          path: pages
      - name: pages built on Linux, Windows and macOS are identical, except for layout drift
        run: python tools/compare_pages.py pages/pages-ubuntu-latest pages/pages-windows-latest pages/pages-macos-latest

  wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build --wheel
      - run: pip install dist/*.whl
      - name: the installed package carries its viewer and vendor files and renders the demo
        run: |
          cd /tmp
          python -c "import ttl3d, pathlib; p = pathlib.Path(ttl3d.__file__).parent; assert (p/'viewer.js').exists() and (p/'viewer-3d.js').exists() and (p/'viewer-2d.js').exists() and (p/'viewer.css').exists() and (p/'vendor'/'fg-bundle.min.js').exists() and callable(ttl3d.show) and callable(ttl3d.to_html)"
          ttl3d "$GITHUB_WORKSPACE/examples/solar-system.ttl" -o /tmp/solar.html
          test -s /tmp/solar.html
