name: release

# A merge to main that changes ttl3d/__init__.py's version tags it (vX.Y.Z), publishes the GitHub
# release with that version's CHANGELOG section as notes, and dispatches publish.yml, which puts
# the package on PyPI and attaches the files. Dispatch, not a reusable-workflow call: PyPI's
# trusted publishing checks the top-level workflow's name against the registered publisher
# (publish.yml), so a reusable call is refused; and workflow_dispatch is the one event the
# workflow token may raise that still creates a run. Zenodo archives the release through its
# webhook. A version that is already tagged is left alone, so a merge without a bump is a no-op.
on:
  push:
    branches: [main]
    paths: [ttl3d/__init__.py]
  workflow_dispatch:

permissions:
  contents: write
  actions: write        # to dispatch publish.yml

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      new: ${{ steps.version.outputs.new }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: version
        name: the version in the package, and whether it is tagged yet
        run: |
          v=$(python3 -c "import re, pathlib; print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('ttl3d/__init__.py').read_text(encoding='utf-8')).group(1))")
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
          if git ls-remote --tags origin "refs/tags/v$v" | grep -q .; then echo "new=false" >> "$GITHUB_OUTPUT"; else echo "new=true" >> "$GITHUB_OUTPUT"; fi
          echo "version $v, tagged already: $(git ls-remote --tags origin "refs/tags/v$v" | grep -c .)"
      - if: steps.version.outputs.new == 'true'
        name: the changelog has a section for this version
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: python3 tools/release_notes.py "${TAG#v}" > notes.md && test -s notes.md
      - if: steps.version.outputs.new == 'true'
        name: tag the merge and publish the GitHub release
        env:
          TAG: ${{ steps.version.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "ttl3d ${TAG#v}"
          git push origin "$TAG"
          gh release create "$TAG" --title "ttl3d ${TAG#v}" --notes-file notes.md --verify-tag
      - if: steps.version.outputs.new == 'true'
        name: dispatch publish.yml for the tag and wait for it
        env:
          TAG: ${{ steps.version.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          before=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run publish.yml --ref main -f tag="$TAG"
          run=""
          for i in $(seq 1 12); do
            sleep 10
            run=$(gh run list --workflow publish.yml --event workflow_dispatch --created ">=$before" --limit 1 --json databaseId --jq '.[0].databaseId')
            [ -n "$run" ] && break
          done
          test -n "$run" || { echo "publish.yml did not start"; exit 1; }
          echo "publish run $run"
          gh run watch "$run" --exit-status --interval 15
